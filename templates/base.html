{%load static%}
<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}CRM - {% endblock %}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://kit.fontawesome.com/79968a301b.js" crossorigin="anonymous"></script>
	<script src="{% static 'js/script.js' %}"></script>
</head>
<body class="bg-body text-body ">
	<header class="d-flex justify-content-between align-items-center p-3 border-bottom">
		<button id="toggle-theme" class="btn btn-outline-secondary rounded-circle shadow-sm d-flex align-items-center justify-content-center" style="width: 45px; height: 45px; transition: all 0.3s ease;"><i class="fa-solid fa-circle-half-stroke"></i></button>
	</header>
	{%block content%}
	{%endblock%}
	<footer class="text-center mt-5 mb-3">
		<p>2026 CRM Servicio Tecnico</p>
		<a href="{%url 'inicio' %}" class="text-body">Inicio</a>
		<a href="{% url 'inventario' %}" class="text-body ms-3">Inventario</a>
	</footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
